<header class="site-header" data-header>
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Sensori home">
      <span class="movement-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span>Sensori</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
      <span class="sr-only">Toggle navigation</span>
      <span></span><span></span>
    </button>

    <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-nav>
      {% for item in site.data.navigation %}
        {% assign current = false %}
        {% if page.url == item.url or page.url contains item.url and item.url != '/' %}
          {% assign current = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
