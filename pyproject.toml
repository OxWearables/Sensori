[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensori"
version = "0.1.0"
description = "Pretraining and inference for Sensori accelerometer representations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "nbconvert>=7,<8",
    "nbformat>=5.10,<6",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
    "twine>=6,<7",
]

[tool.setuptools]
packages = [
    "sensori",
    "scripts",
    "scripts.tutorial_har",
    "scripts.tutorial_nhanes",
]

[tool.setuptools.package-dir]
sensori = "src"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"scripts.tutorial_nhanes" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "sensori"]
